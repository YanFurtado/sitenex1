# Cole estes 2 blocos dentro do "server { }" do site, ANTES do "location / { ... }".

# /parceiros abre o diretório
location = /parceiros {
  add_header Cache-Control "no-cache";
  try_files /parceiros.html =404;
}

# /parceiros/<nome> abre o modelo único de perfil (ele lê o nome do endereço)
location ^~ /parceiros/ {
  add_header Cache-Control "no-cache";
  try_files /parceiro.html =404;
}
